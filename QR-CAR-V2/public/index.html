<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR CAR</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

.container {
    max-width: 430px;
    margin: auto;
    min-height: 100vh;
    padding: 25px 18px;
}

.card {
    background: #1c1c1c;
    padding: 25px;
    border-radius: 25px;
    margin-top: 40px;
    box-shadow: 0 5px 25px rgba(0,0,0,.5);
}

.logo {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
}

.logo span {
    color: #d4af37;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #d4af37;
    color: #111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

#message {
    text-align: center;
    margin-top: 15px;
    color: #ff5555;
}
</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
🚗 <span>QR CAR</span>
</div>

<div class="subtitle">
Avtomobil ma'lumotlarini QR orqali ko‘ring
</div>

<input
    id="qr"
    placeholder="QR ID kiriting"
    autocomplete="off"
>

<button onclick="openQR()">
QR profilni ochish
</button>

<div id="message"></div>

</div>

</div>


<script>

function openQR() {

    const qr =
        document
        .getElementById("qr")
        .value
        .trim();


    if (!qr) {

        document
        .getElementById("message")
        .innerText =
        "QR ID kiriting";

        return;

    }


    window.location.href =
        "/car/" +
        encodeURIComponent(qr);

}

</script>

</body>
</html>
